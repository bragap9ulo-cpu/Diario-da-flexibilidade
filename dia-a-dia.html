<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Meu Dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;--surface:#141414;--surface2:#1E1E1E;--surface3:#272727;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text1:#F0EEE8;--text2:#AAA;--text3:#777;
  --amber:#F5A623;--amber-bg:rgba(245,166,35,0.12);
  --blue:#4DA6FF;--blue-bg:rgba(77,166,255,0.12);
  --red:#FF6B6B;--red-bg:rgba(255,107,107,0.12);
  --green:#5CBF6A;--green-bg:rgba(92,191,106,0.12);
  --gold:#FFD93D;--gold-bg:rgba(255,217,61,0.1);
  --teal:#34D399;--teal-bg:rgba(52,211,153,0.12);
  --purple:#C084FC;--purple-bg:rgba(192,132,252,0.12);
  --r:10px;--r-sm:7px;--nav-h:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{color-scheme:dark;}
html,body{background:var(--bg);color:var(--text1);font-family:'DM Sans',sans-serif;min-height:100vh;overscroll-behavior:none;}
.app{max-width:430px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 24px);}
.header{padding:52px 20px 12px;}
.header-date{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;}
.header-title{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:700;color:var(--text1);line-height:1;}
.header-sub{font-size:13px;color:var(--text2);margin-top:4px;}
.sec{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.12em;text-transform:uppercase;margin:20px 20px 8px;}
.card{margin:0 16px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.card-pad{padding:14px 16px;}
.overall-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.overall-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.overall-pct{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--text1);}
.bar-track{background:var(--surface3);border-radius:99px;height:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width .4s ease;background:linear-gradient(90deg,var(--green),var(--amber));}
.rem-item{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
.rem-item:last-child{border-bottom:none;}
.rem-icon{width:28px;height:28px;border-radius:8px;background:var(--gold-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.rem-text{flex:1;font-size:14px;color:var(--text1);line-height:1.4;}
.rem-del{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;}
.plan-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.04em;}
.plan-hdr{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
.plan-hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sub-sec{padding:8px 16px 4px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;border-top:1px solid var(--border);}
.ex-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);transition:opacity .2s;}
.ex-row:last-of-type{border-bottom:none;}
.ex-row.done{opacity:.35;}
.chk-circle{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:all .15s;}
.ex-info{flex:1;min-width:0;}
.ex-name{font-size:14px;color:var(--text1);}
.ex-row.done .ex-name{text-decoration:line-through;color:var(--text3);}
.ex-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ex-stats{display:flex;gap:5px;}
.ex-stat{text-align:center;min-width:36px;}
.ex-stat-val{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;color:var(--text1);line-height:1;}
.ex-stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;}
.tmr-ico{width:30px;height:30px;border-radius:50%;border:1px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmr-ico:active{background:var(--surface3);}
.task-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);}
.task-row:last-of-type{border-bottom:none;}
.chk-sq{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:all .15s;}
.task-label{flex:1;font-size:14px;color:var(--text1);}
.task-row.done .task-label{text-decoration:line-through;color:var(--text3);}
.add-row{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--border);}
.inp{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text1);font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 12px;width:100%;}
.inp:focus{outline:none;border-color:var(--border2);}
.inp::placeholder{color:var(--text3);}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text1);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 14px;cursor:pointer;white-space:nowrap;}
.btn:active{background:var(--surface3);}
.btn-full{width:calc(100% - 32px);display:block;text-align:center;padding:11px;border-radius:var(--r-sm);margin:10px 16px;}
.plan-tab-wrap{display:flex;gap:6px;margin:0 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.plan-tab-wrap::-webkit-scrollbar{display:none;}
.ptab{position:relative;flex-shrink:0;min-width:44px;padding:9px 12px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;background:none;color:var(--text3);transition:all .15s;}
.ptab.act{color:var(--text1);background:var(--surface2);border-color:var(--border2);}
.ptab-del{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--surface3);border:1px solid var(--border2);color:var(--text3);font-size:12px;line-height:18px;text-align:center;cursor:pointer;display:none;}
.ptab:hover .ptab-del{display:block;}
.ptab-add{flex-shrink:0;min-width:44px;padding:9px 12px;text-align:center;font-size:20px;font-weight:300;border:1px dashed var(--border2);border-radius:var(--r-sm);cursor:pointer;background:none;color:var(--text3);}
.ptab-sp{flex-shrink:0;padding:9px 10px;text-align:center;font-size:14px;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;background:none;color:var(--text3);}
.ptab-sp.act{background:var(--surface2);border-color:var(--border2);color:var(--text2);}
.ex-col-hd{display:grid;grid-template-columns:1fr 38px 50px 50px 24px;gap:5px;padding:7px 16px;border-bottom:1px solid var(--border);}
.ex-edit-row{display:grid;grid-template-columns:1fr 38px 50px 50px 24px;gap:5px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);}
.ex-edit-row:last-of-type{border-bottom:none;}
.col-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;text-align:center;}
.col-lbl:first-child{text-align:left;}
.inp-edit{background:transparent;border:none;color:var(--text1);font-family:'DM Sans',sans-serif;font-size:13px;padding:4px 0;width:100%;border-bottom:1px solid transparent;}
.inp-edit:focus{outline:none;border-bottom-color:var(--border2);}
.inp-num{background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text1);font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;padding:5px 2px;width:100%;text-align:center;}
.inp-num:focus{outline:none;border-color:var(--border2);}
.del-btn{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:0;line-height:1;}
.rest-cfg{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--border);}
.rest-cfg-lbl{font-size:13px;color:var(--text2);flex:1;}
.rest-cfg-inp{width:60px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text1);font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;padding:6px 8px;text-align:center;}
.rest-cfg-inp:focus{outline:none;border-color:var(--border2);}
.rest-cfg-unit{font-size:12px;color:var(--text3);}
.delete-plan-btn{display:block;width:calc(100% - 32px);margin:0 16px 10px;padding:11px;border-radius:var(--r-sm);border:1px solid rgba(255,107,107,0.3);background:rgba(255,107,107,0.07);color:#FF6B6B;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;text-align:center;}
.cal-pills{display:flex;gap:6px;padding:0 16px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.cal-pills::-webkit-scrollbar{display:none;}
.cal-pill{padding:8px 14px;border-radius:99px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;border:1.5px solid var(--border2);cursor:pointer;background:var(--surface2);color:var(--text3);white-space:nowrap;flex-shrink:0;}
.cal-pill.sel{border-width:2px;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 16px;margin-bottom:4px;}
.cal-wd{text-align:center;font-size:11px;color:var(--text3);padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 16px;}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);background:var(--surface2);}
.cal-day.today{border-width:2px;}
.cal-day.emp{visibility:hidden;}
.cal-num{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;color:var(--text2);line-height:1;}
.cal-tag{font-size:9px;font-weight:700;margin-top:2px;line-height:1;}
.rest-day{text-align:center;padding:28px 16px;}
.rest-day h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--text2);margin-bottom:6px;}
.rest-day p{font-size:13px;color:var(--text2);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:rgba(10,10,10,0.96);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;max-width:430px;margin:0 auto;backdrop-filter:blur(12px);z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 0;}
.nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.nav-label{font-size:10px;color:var(--text2);}
.nav-item.act .nav-label{color:var(--text1);}
.nav-item.act svg path,.nav-item.act svg rect,.nav-item.act svg circle{stroke:var(--text1)!important;}
.nav-item:not(.act) svg path,.nav-item:not(.act) svg rect,.nav-item:not(.act) svg circle{stroke:var(--text2)!important;}
/* CORPO / MEDIDAS */
.cal-tip{font-size:11px;color:var(--text3);text-align:center;padding:10px 16px 14px;line-height:1.5;}
.seg{display:flex;margin:0 16px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;gap:3px;}
.seg button{flex:1;background:none;border:none;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;padding:7px;border-radius:5px;cursor:pointer;}
.seg button.act{background:var(--surface3);color:var(--text1);}
.mhdr{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;color:var(--text1);margin-bottom:12px;letter-spacing:.03em;}
.mhdr span{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:400;color:var(--text3);margin-left:6px;}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.bstat{background:var(--surface2);border-radius:var(--r-sm);padding:10px 6px;text-align:center;}
.bstat-v{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1;}
.bstat-v small,.mrow-v small{font-size:11px;color:var(--text3);font-weight:500;margin-left:2px;}
.bstat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}
.bstat .dl{display:block;margin-top:4px;}
.dl{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);}
.mrow:last-child{border-bottom:none;}
.mrow-l{font-size:13px;color:var(--text2);}
.mrow-h{font-size:10px;color:var(--text3);margin-top:2px;}
.mrow-v{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;color:var(--text1);display:flex;align-items:baseline;gap:8px;white-space:nowrap;}
.mrow-v .dl{min-width:42px;text-align:right;}
.mb-hd,.mb-row{display:grid;grid-template-columns:1fr 70px 70px;gap:6px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--border);}
.mb-hd{padding:7px 16px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;text-align:center;}
.mb-row:last-child{border-bottom:none;}
.mb-v{display:flex;flex-direction:column;align-items:center;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;line-height:1.15;}
.mb-v .dl{font-size:12px;}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;}
.frow label{font-size:13px;color:var(--text2);flex:1;}
.frow label span{color:var(--text3);font-size:11px;}
.fin{width:90px;font-size:16px;padding:7px 4px;}

.timer-ov{position:fixed;inset:0;background:rgba(0,0,0,0.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300;}
.timer-ov.show{display:flex;}
.timer-type{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.timer-exname{font-size:15px;color:var(--text2);margin-bottom:28px;text-align:center;padding:0 32px;max-width:320px;line-height:1.4;}
.timer-ring{position:relative;width:220px;height:220px;}
.timer-ring svg{position:absolute;inset:0;}
.timer-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-num{font-family:'Barlow Condensed',sans-serif;font-size:86px;font-weight:700;color:var(--text1);line-height:1;}
.timer-seclbl{font-size:13px;color:var(--text3);margin-top:4px;}
.timer-done{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;color:var(--green);margin-top:20px;opacity:0;transition:opacity .4s;}
.timer-done.show{opacity:1;}
.timer-close{margin-top:12px;background:none;border:1px solid var(--border);border-radius:99px;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 32px;cursor:pointer;}
.timer-preset{background:var(--surface2);border:1px solid var(--border2);border-radius:99px;color:var(--text2);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;padding:10px 16px;cursor:pointer;}
.timer-preset:active{background:var(--surface3);}
</style>
</head>
<body>

<div class="timer-ov" id="tov">
  <div class="timer-type" id="ttype">Descanso</div>
  <div class="timer-exname" id="texname"></div>
  <div class="timer-ring">
    <svg width="220" height="220" viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="98" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="9"/>
      <circle id="tarc" cx="110" cy="110" r="98" fill="none" stroke="#5CBF6A" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="615.75" stroke-dashoffset="0"
        transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1s linear,stroke .4s;"/>
    </svg>
    <div class="timer-inner">
      <div class="timer-num" id="tnum">90</div>
      <div class="timer-seclbl">segundos</div>
    </div>
  </div>
  <div class="timer-done" id="tdone">Bora! 💪</div>
  <div style="display:flex;gap:8px;margin-top:28px;flex-wrap:wrap;justify-content:center;padding:0 24px;">
    <button class="timer-preset" onclick="setTimer(30)">30s</button>
    <button class="timer-preset" onclick="setTimer(60)">1 min</button>
    <button class="timer-preset" onclick="setTimer(90)">1:30</button>
    <button class="timer-preset" onclick="setTimer(120)">2 min</button>
    <button class="timer-preset" onclick="setTimer(180)">3 min</button>
  </div>
  <button class="timer-close" onclick="stopTimer()">Fechar</button>
</div>

<div class="app">
  <div class="header">
    <div class="header-date" id="hdate"></div>
    <div class="header-title">Meu Dia</div>
    <div class="header-sub" id="hsub"></div>
  </div>
  <div id="mc"></div>
</div>

<div class="bottom-nav" id="bnav">
  <div class="nav-item act" data-v="hoje"><div class="nav-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 9.5L11 3l8 6.5V19a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 20v-7h6v7" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div><span class="nav-label">Hoje</span></div>
  <div class="nav-item" data-v="treinos"><div class="nav-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="5" cy="11" r="2" stroke="#fff" stroke-width="1.5"/><circle cx="17" cy="11" r="2" stroke="#fff" stroke-width="1.5"/><path d="M7 11h8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="M3 11H1M21 11h-2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg></div><span class="nav-label">Treinos</span></div>
  <div class="nav-item" data-v="cal"><div class="nav-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="5" width="16" height="15" rx="2" stroke="#fff" stroke-width="1.5"/><path d="M3 9h16M8 2v4M14 2v4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg></div><span class="nav-label">Calendário</span></div>
  <div class="nav-item" data-v="corpo"><div class="nav-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="3" width="16" height="16" rx="4" stroke="#fff" stroke-width="1.5"/><path d="M7.5 10a5 5 0 017 0" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M11 10l1.6-2.2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg></div><span class="nav-label">Corpo</span></div>
  <div class="nav-item" data-v="lemb"><div class="nav-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 11a7 7 0 0114 0v2l1.5 2H2.5L4 13v-2z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M11 4V2M8 20c0 1.1 1.343 2 3 2s3-.9 3-2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg></div><span class="nav-label">Lembretes</span></div>
</div>

<script>
const PALETTE=[
  {color:'var(--amber)',bg:'var(--amber-bg)',hex:'#F5A623'},
  {color:'var(--blue)', bg:'var(--blue-bg)', hex:'#4DA6FF'},
  {color:'var(--red)',  bg:'var(--red-bg)',  hex:'#FF6B6B'},
  {color:'var(--green)',bg:'var(--green-bg)',hex:'#5CBF6A'},
  {color:'#C084FC',    bg:'rgba(192,132,252,0.12)',hex:'#C084FC'},
  {color:'#FB923C',    bg:'rgba(251,146,60,0.12)', hex:'#FB923C'},
  {color:'#34D399',    bg:'rgba(52,211,153,0.12)', hex:'#34D399'},
  {color:'#F472B6',    bg:'rgba(244,114,182,0.12)',hex:'#F472B6'},
];
// Special day configs (fixed, not user-deletable)

// ── TIMER ──
let tInt=null,tTotal=90,tLeft=90;
function startTimer(secs,name,type){
  clearInterval(tInt);tTotal=secs;tLeft=secs;
  document.getElementById('texname').textContent=name;
  document.getElementById('ttype').textContent=type;
  document.getElementById('tdone').classList.remove('show');
  document.getElementById('tov').classList.add('show');
  updTimer();
  tInt=setInterval(()=>{tLeft--;if(tLeft<=0){tLeft=0;updTimer();clearInterval(tInt);document.getElementById('tdone').classList.add('show');if(navigator.vibrate)navigator.vibrate([300,100,300]);}else updTimer();},1000);
}
function updTimer(){
  document.getElementById('tnum').textContent=tLeft;
  const arc=document.getElementById('tarc');
  arc.style.strokeDashoffset=CIRC*(1-tLeft/tTotal);
  arc.style.stroke=tLeft<=10?'#FF6B6B':tLeft<=30?'#F5A623':'#5CBF6A';
}
function setTimer(secs){clearInterval(tInt);tTotal=secs;tLeft=secs;document.getElementById('tdone').classList.remove('show');updTimer();tInt=setInterval(()=>{tLeft--;if(tLeft<=0){tLeft=0;updTimer();clearInterval(tInt);document.getElementById('tdone').classList.add('show');if(navigator.vibrate)navigator.vibrate([300,100,300]);}else updTimer();},1000);}
function stopTimer(){clearInterval(tInt);document.getElementById('tov').classList.remove('show');}

function ticoBtn(secs,label,type){
  if(!secs)return '';
  return `<button class="tmr-ico" onclick="startTimer(${secs},'${label.replace(/'/g,"\\'")}','${type}')"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="8.5" r="5.2" stroke="var(--text3)" stroke-width="1.2"/><path d="M7.5 5.5v3l1.8 1.1" stroke="var(--text3)" stroke-width="1.2" stroke-linecap="round"/><path d="M5.5 1.2h4M7.5 1.2v2" stroke="var(--text3)" stroke-width="1.2" stroke-linecap="round"/></svg></button>`;
}
function cBtn(id,color,sq){
  const d=isDone(id);
  return `<button class="${sq?'chk-sq':'chk-circle'}" onclick="tog('${id}')" style="${sq?'border-radius:5px;':'border-radius:50%;'}${d?'background:'+color+';border-color:'+color:''}">${d?CHK:''}</button>`;
}

function setHdr(){
  document.getElementById('hdate').textContent=WDS[TODAY.getDay()]+', '+TODAY.getDate()+' de '+MOS[TODAY.getMonth()]+' de '+TODAY.getFullYear();
  const tp=S.sched[tkey()];
  const pd=tp&&!SPECIAL[tp]?S.plans[tp]:null;
  document.getElementById('hsub').textContent=
    tp==='R'?'🛌 Dia de descanso':
    tp==='CO'?'🏃 Dia de corrida':
    tp==='AL'?'🧘 Dia de alongamento':
    pd?'Treino '+tp+' — '+pd.name:
    'Sem atividade agendada hoje';
}

function vHoje(){
  const tk=tkey(),tp=S.sched[tk];
  const isRest=tp==='R', isCO=tp==='CO', isAL=tp==='AL';
  const isSpecial=isRest||isCO||isAL;
  const pd=tp&&!isSpecial?S.plans[tp]:null;
  const col=pd?pc(tp):null;
  const exs=pd?pd.exs:[];
  const cardio=pd?pd.cardio:(isRest?(S.restDay.cardio||[]):[]);
  const cardioRest=pd?pd.cardioRest:0;
  const mainExs=exs.filter(e=>e.kg>0);
  const coreExs=exs.filter(e=>e.kg===0);
  const exd=exs.filter(e=>isDone(e.id)).length;
  const cad=cardio.filter(c=>isDone(c.id)).length;

  // CO / AL items
  const coItems=isCO?(S.corridaDay.items||[]):[];
  const alItems=isAL?(S.alongDay.items||[]):[];
  const coD=coItems.filter(x=>isDone(x.id)).length;
  const alD=alItems.filter(x=>isDone(x.id)).length;

  const metad=S.metas.filter(m=>isDone(m.id)).length;
  const actItems=isCO?coItems.length:isAL?alItems.length:exs.length+cardio.length;
  const actDone=isCO?coD:isAL?alD:exd+cad;
  const total=actItems+S.metas.length;
  const done=actDone+metad;
  const pct=total?Math.round(done/total*100):0;

  let h=`<div class="card card-pad" style="margin:0 16px 4px;">
    <div class="overall-row"><span class="overall-label">Progresso do dia</span><span class="overall-pct">${pct}%</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
  </div>`;

  if(S.reminders.length){
    const todayRems=S.reminders.filter(r=>!r.date||r.date===tk);
    if(todayRems.length){
      h+=`<div class="sec">Lembretes</div><div class="card">`;
      todayRems.forEach(r=>{
        h+=`<div class="rem-item"><div class="rem-icon">${r.date?'📅':'💬'}</div><span class="rem-text">${r.tx}</span></div>`;
      });
      h+=`</div>`;
    }
  }

  h+=`<div class="sec">Atividade de hoje</div>`;

  if(isRest){
    h+=`<div class="card"><div class="rest-day"><h2>🛌 Descanso</h2><p>Recuperação programada.<br>O músculo cresce no descanso — aproveite.</p></div></div>`;
    if(S.restDay.cardio&&S.restDay.cardio.length){
      h+=`<div class="sec">Cardio leve (opcional)</div><div class="card">`;
      S.restDay.cardio.forEach(c=>{
        const d=isDone(c.id);
        h+=`<div class="task-row ${d?'done':''}">${cBtn(c.id,'#FF6B6B',true)}<span class="task-label">${c.tx}</span></div>`;
      });
      h+=`</div>`;
    }
  } else if(isCO){
    h+=`<div class="card"><div class="plan-hdr">
      <div class="plan-hdr-row">
        <span class="plan-badge" style="background:rgba(52,211,153,0.1);color:#34D399;">🏃 Dia de Corrida</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#34D399;">${coD}/${coItems.length}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${coItems.length?Math.round(coD/coItems.length*100):0}%;background:#34D399;"></div></div>
    </div>`;
    coItems.forEach(x=>{
      const d=isDone(x.id);
      h+=`<div class="task-row ${d?'done':''}">${cBtn(x.id,'#34D399',true)}<span class="task-label">${x.tx}</span></div>`;
    });
    h+=`</div>`;
  } else if(isAL){
    h+=`<div class="card"><div class="plan-hdr">
      <div class="plan-hdr-row">
        <span class="plan-badge" style="background:rgba(192,132,252,0.1);color:#C084FC;">🧘 Alongamento</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#C084FC;">${alD}/${alItems.length}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${alItems.length?Math.round(alD/alItems.length*100):0}%;background:#C084FC;"></div></div>
    </div>`;
    alItems.forEach(x=>{
      const d=isDone(x.id);
      h+=`<div class="task-row ${d?'done':''}">${cBtn(x.id,'#C084FC',true)}<span class="task-label">${x.tx}</span></div>`;
    });
    h+=`</div>`;
  } else if(!pd){
    h+=`<div class="card"><div class="rest-day"><h2>Sem atividade</h2><p>Nenhuma atividade agendada.<br>Configure na aba Calendário.</p></div></div>`;
  } else {
    h+=`<div class="card"><div class="plan-hdr">
      <div class="plan-hdr-row">
        <span class="plan-badge" style="background:${col.bg};color:${col.color};">Treino ${tp} — ${pd.name}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:${col.hex};">${exd}/${exs.length}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${exs.length?Math.round(exd/exs.length*100):0}%;background:${col.hex};"></div></div>
    </div>`;
    if(mainExs.length){
      h+=`<div class="sub-sec">Musculação</div>`;
      mainExs.forEach(ex=>{
        const d=isDone(ex.id);
        h+=`<div class="ex-row ${d?'done':''}">${cBtn(ex.id,col.hex,false)}
          <div class="ex-info"><div class="ex-name">${ex.nm}</div></div>
          <div class="ex-right"><div class="ex-stats">
            <div class="ex-stat"><div class="ex-stat-val">${ex.sets}×</div><div class="ex-stat-lbl">séries</div></div>
            <div class="ex-stat"><div class="ex-stat-val">${ex.reps}</div><div class="ex-stat-lbl">reps</div></div>

          </div>${ticoBtn(pd.rest||75,ex.nm,'Descanso')}</div>
        </div>`;
      });
    }
    if(coreExs.length){
      h+=`<div class="sub-sec">Core finisher</div>`;
      coreExs.forEach(ex=>{
        const d=isDone(ex.id);
        h+=`<div class="ex-row ${d?'done':''}">${cBtn(ex.id,'#5CBF6A',false)}
          <div class="ex-info"><div class="ex-name">${ex.nm}</div></div>
          <div class="ex-right"><div class="ex-stats">
            <div class="ex-stat"><div class="ex-stat-val">${ex.sets}×</div><div class="ex-stat-lbl">séries</div></div>
            <div class="ex-stat"><div class="ex-stat-val">${ex.reps}</div><div class="ex-stat-lbl">exec</div></div>
          </div></div>
        </div>`;
      });
    }

// ── CORPO (MEDIDAS) ──
function sortedM(){return S.medidas.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
function fmtD(d){const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtS(d){const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);}
function has(v){return v!=null&&v!==''&&!isNaN(v);}
function fmtN(v){return has(v)?(+v).toLocaleString('pt-BR',{maximumFractionDigits:2}):'—';}
function delta(cur,ref,dir){
  if(!has(cur)||!has(ref))return '';
  const d=+(cur-ref).toFixed(2);
  if(d===0)return `<span class="dl" style="color:var(--text3)">=</span>`;
  const c=dir===0?'var(--text2)':(d*dir>0?'var(--green)':'var(--red)');
  return `<span class="dl" style="color:${c}">${d>0?'+':''}${d.toLocaleString('pt-BR',{maximumFractionDigits:2})}</span>`;
}
function mrow(l,v,u,dl){
  return `<div class="mrow"><div class="mrow-l">${l}</div><div class="mrow-v"><span>${fmtN(v)}<small>${u}</small></span>${dl}</div></div>`;
}
function idxRow(l,v,c,hint){
  return `<div class="mrow"><div class="mrow-l">${l}<div class="mrow-h">${hint}</div></div><div class="mrow-v" style="color:${c}">${v==null?'—':v.toFixed(2).replace('.',',')}</div></div>`;
}
function chart(L,k){
  const pts=L.filter(m=>has(m[k]));
  if(pts.length<2)return `<div class="cal-tip" style="padding:14px 0 4px;">O gráfico aparece a partir da 2ª medição.</div>`;
  const W=340,H=140,px=28,py=22;
  const vs=pts.map(m=>+m[k]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn-=1;mx+=1;}
  const ts=pts.map(m=>new Date(m.date+'T12:00:00').getTime());
  const t0=ts[0],t1=ts[ts.length-1];
  const X=i=>px+(t1===t0?0:(ts[i]-t0)/(t1-t0))*(W-2*px);
  const Y=v=>py+(1-(v-mn)/(mx-mn))*(H-2*py-8);
  const poly=pts.map((m,i)=>X(i).toFixed(1)+','+Y(+m[k]).toFixed(1)).join(' ');
  const n=pts.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <polyline points="${poly}" fill="none" stroke="#F5A623" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((m,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(+m[k]).toFixed(1)}" r="3.5" fill="#0A0A0A" stroke="#F5A623" stroke-width="2"/>`).join('')}
    <text x="${X(0)}" y="${Y(+pts[0][k])-9}" fill="#AAA" font-size="11" font-family="DM Sans" text-anchor="start">${fmtN(pts[0][k])}</text>
    <text x="${X(n)}" y="${Y(+pts[n][k])-9}" fill="#F0EEE8" font-size="11" font-family="DM Sans" text-anchor="end">${fmtN(pts[n][k])}</text>
    <text x="${px}" y="${H-3}" fill="#777" font-size="10" font-family="DM Sans">${fmtS(pts[0].date)}</text>
    <text x="${W-px}" y="${H-3}" fill="#777" font-size="10" font-family="DM Sans" text-anchor="end">${fmtS(pts[n].date)}</text>
  </svg>`;
}

  // gráfico

    ${chart(L,MCH)}

  // composição

  h+=`<div style="display:flex;gap:8px;margin:12px 16px 0;">

function newMed(){MMODE='form';MEDIT=null;render();window.scrollTo(0,0);}
function editMed(id){MMODE='form';MEDIT=id;render();window.scrollTo(0,0);}
function delMed(id){
  const m=S.medidas.find(x=>x.id===id);if(!m)return;
  if(!confirm('Excluir a medição de '+fmtD(m.date)+'?'))return;
  S.medidas=S.medidas.filter(x=>x.id!==id);
  MIDX=null;save();render();
}
function saveMed(){
  const date=document.getElementById('f_date').value;
  if(!date){alert('Informe a data.');return;}
  const num=id=>{const el=document.getElementById(id);if(!el)return null;const s=el.value.trim().replace(',','.');if(s==='')return null;const n=parseFloat(s);return isNaN(n)?null:n;};
  const keys=[...COMP.map(f=>f.k),...TR.map(f=>f.k),...MB.flatMap(f=>[f.k+'_d',f.k+'_e'])];
  const m={id:MEDIT||uid(),date,alt:num('f_alt')};
  keys.forEach(k=>{m[k]=num('f_'+k);});
  if(m.alt)S.altura=m.alt;
  if(m.imc==null&&m.peso&&m.alt)m.imc=+(m.peso/Math.pow(m.alt/100,2)).toFixed(1);
  const dup=S.medidas.find(x=>x.date===date&&x.id!==MEDIT);
  if(dup){
    if(!confirm('Já existe medição em '+fmtD(date)+'. Substituir?'))return;
    S.medidas=S.medidas.filter(x=>x.id!==dup.id);
  }
  S.medidas=S.medidas.filter(x=>x.id!==m.id);
  S.medidas.push(m);
  save();
  MMODE='view';MEDIT=null;
  MIDX=sortedM().findIndex(x=>x.id===m.id);
  render();window.scrollTo(0,0);
}

// ── LEMBRETES ──
function fmtDate(d){
  if(!d)return '';const [y,m,day]=d.split('-');return day+'/'+m+'/'+y;
}
function vLemb(){
  const fixed=S.reminders.filter(r=>!r.date);
  const scheduled=S.reminders.filter(r=>!!r.date).sort((a,b)=>a.date.localeCompare(b.date));

  let h=`<div class="sec">Lembretes fixos</div><div class="card">
    <div style="padding:10px 16px 6px;font-size:12px;color:var(--text3);">Aparecem todo dia no topo da aba Hoje</div>
    ${fixed.map(r=>`<div class="rem-item">
      <div class="rem-icon">💬</div>
      <span class="rem-text">${r.tx}</span>
      <button class="rem-del" onclick="delRem('${r.id}')">×</button>
    </div>`).join('')}
    <div class="add-row"><input class="inp" id="ri" placeholder="Novo lembrete fixo..." onkeydown="if(event.key==='Enter')addRem()"></div>
    <button class="btn btn-full" onclick="addRem()">+ Adicionar lembrete fixo</button>
  </div>`;

  h+=`<div class="sec">Lembretes agendados</div><div class="card">
    <div style="padding:10px 16px 6px;font-size:12px;color:var(--text3);">Aparecem só no dia marcado — consultas, compromissos, eventos</div>`;
  if(scheduled.length){
    scheduled.forEach(r=>{
      const isPast=r.date<tkey();
      h+=`<div class="rem-item" style="${isPast?'opacity:.45':''}">
        <div class="rem-icon">📅</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;color:var(--text1);line-height:1.4;">${r.tx}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px;">${fmtDate(r.date)}${isPast?' — já passou':r.date===tkey()?' — hoje!':''}</div>
        </div>
        <button class="rem-del" onclick="delRem('${r.id}')">×</button>
      </div>`;
    });
  } else {
    h+=`<div style="padding:14px 16px;font-size:13px;color:var(--text3);text-align:center;">Nenhum lembrete agendado</div>`;
  }
  h+=`<div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;">
    <input class="inp" id="sri" placeholder="Ex: Consulta médica, dentista...">
    <div style="display:flex;gap:8px;align-items:center;">
      <div style="font-size:12px;color:var(--text2);flex-shrink:0;">📅 Data:</div>
      <input type="date" id="srd" class="inp" style="flex:1;" value="${tkey()}" min="${tkey()}">
    </div>
    <button class="btn btn-full" style="margin:0;" onclick="addScheduledRem()">+ Agendar lembrete</button>
  </div></div>`;

  h+=`<div class="sec">Metas fixas</div><div class="card">
    <div style="padding:10px 16px 6px;font-size:12px;color:var(--text3);">Aparecem todo dia na lista de metas</div>
    ${S.metas.map(m=>`<div class="task-row"><span class="task-label">${m.tx}</span><button class="del-btn" onclick="delMeta('${m.id}')">×</button></div>`).join('')}
    <div class="add-row"><input class="inp" id="mci" placeholder="Nova meta fixa..." onkeydown="if(event.key==='Enter')addMetaCfg()"><button class="btn" onclick="addMetaCfg()">+</button></div>
  </div>
  <div class="sec">Dados</div>
  <div class="card card-pad" style="display:flex;flex-direction:column;gap:10px;">
    <div style="font-size:13px;color:var(--text2);">Restaura todos os treinos, exercícios, calendário e configurações para o padrão original. Lembretes, metas e medidas corporais são mantidos.</div>
    <button onclick="restorePlans()" style="padding:11px;border-radius:var(--r-sm);border:1px solid rgba(245,166,35,0.4);background:rgba(245,166,35,0.08);color:#F5A623;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;text-align:center;width:100%;">↺ Restaurar treinos padrão (A, B, C, D)</button>
    <button onclick="resetAll()" style="padding:11px;border-radius:var(--r-sm);border:1px solid rgba(255,107,107,0.3);background:rgba(255,107,107,0.07);color:#FF6B6B;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;text-align:center;width:100%;">⚠ Apagar tudo e recomeçar do zero</button>
  </div>`;

  document.getElementById('mc').innerHTML=h;
}

// ── RESTORE / RESET ──
function restorePlans(){
  if(!confirm('Restaurar treinos A, B, C e D com exercícios e calendário padrão?\n\nSeus lembretes e metas personalizados serão mantidos.'))return;
  const d=JSON.parse(JSON.stringify(DEF));
  S.planOrder=d.planOrder;S.plans=d.plans;S.restDay=d.restDay;
  S.corridaDay=d.corridaDay;S.alongDay=d.alongDay;S.sched=d.sched;
  EP=S.planOrder[0];save();render();
  alert('Treinos restaurados com sucesso! ✅');
}
function resetAll(){
  if(!confirm('⚠ Apagar TUDO e voltar ao estado inicial?\n\nIsso inclui as medidas corporais. Essa ação não pode ser desfeita.'))return;
  S=JSON.parse(JSON.stringify(DEF));S.remSeed=DEF.reminders.map(r=>r.tx);EP=S.planOrder[0];MIDX=null;save();render();
  alert('App resetado com sucesso! ✅');
}

// ── PLAN MANAGEMENT ──
function addPlan(){
  const next=LETTERS.split('').find(l=>!S.planOrder.includes(l));
  if(!next)return;
  S.plans[next]={name:'Treino '+next,rest:75,exs:[],cardio:[],cardioRest:30};
  S.planOrder.push(next);EP=next;save();render();
}
function deletePlan(key){
  if(S.planOrder.length<=1){alert('Precisa ter pelo menos um treino.');return;}
  if(!confirm('Excluir Treino '+key+'? Os dias agendados com ele serão limpos.'))return;
  delete S.plans[key];S.planOrder=S.planOrder.filter(k=>k!==key);
  for(const dk in S.sched){if(S.sched[dk]===key)delete S.sched[dk];}
  EP=S.planOrder[0];save();render();
}

// ── ACTIONS ──
function updEx(id,f,v){for(const k in S.plans){if(!S.plans[k].exs)continue;const e=S.plans[k].exs.find(x=>x.id===id);if(e){e[f]=v;break;}}save();}
function delEx(id){for(const k in S.plans){if(!S.plans[k].exs)continue;const idx=S.plans[k].exs.findIndex(e=>e.id===id);if(idx>=0){S.plans[k].exs.splice(idx,1);break;}}save();render();}
function addEx(){if(!S.plans[EP])return;S.plans[EP].exs.push({id:uid(),nm:'Novo exercício',sets:3,reps:'10',kg:0});save();render();}
function addPlanCardio(){const inp=document.getElementById('cai');if(!inp||!inp.value.trim())return;if(!S.plans[EP].cardio)S.plans[EP].cardio=[];S.plans[EP].cardio.push({id:uid(),tx:inp.value.trim()});inp.value='';save();render();}
function delPlanCardio(id){S.plans[EP].cardio=S.plans[EP].cardio.filter(c=>c.id!==id);save();render();}
function addRestCardio(){const inp=document.getElementById('rcai');if(!inp||!inp.value.trim())return;if(!S.restDay.cardio)S.restDay.cardio=[];S.restDay.cardio.push({id:uid(),tx:inp.value.trim()});inp.value='';save();render();}
function delRestCardio(id){S.restDay.cardio=S.restDay.cardio.filter(c=>c.id!==id);save();render();}
function addCorridaItem(){const inp=document.getElementById('coai');if(!inp||!inp.value.trim())return;if(!S.corridaDay.items)S.corridaDay.items=[];S.corridaDay.items.push({id:uid(),tx:inp.value.trim()});inp.value='';save();render();}
function delCorridaItem(id){S.corridaDay.items=S.corridaDay.items.filter(c=>c.id!==id);save();render();}
function addAlongItem(){const inp=document.getElementById('alai');if(!inp||!inp.value.trim())return;if(!S.alongDay.items)S.alongDay.items=[];S.alongDay.items.push({id:uid(),tx:inp.value.trim()});inp.value='';save();render();}
function delAlongItem(id){S.alongDay.items=S.alongDay.items.filter(c=>c.id!==id);save();render();}
function assignDay(key){
  if(!CSEL||CSEL==='X'){delete S.sched[key];}
  else if(S.sched[key]===CSEL){delete S.sched[key];}
  else{S.sched[key]=CSEL;}
  save();render();
}
function addRem(){const i=document.getElementById('ri');if(!i||!i.value.trim())return;S.reminders.push({id:uid(),tx:i.value.trim(),date:null});i.value='';save();render();}
function addScheduledRem(){
  const ti=document.getElementById('sri'),di=document.getElementById('srd');
  if(!ti||!ti.value.trim()){alert('Escreva o lembrete.');return;}
  if(!di||!di.value){alert('Escolha uma data.');return;}
  S.reminders.push({id:uid(),tx:ti.value.trim(),date:di.value});
  ti.value='';di.value='';save();render();
}
function delRem(id){S.reminders=S.reminders.filter(r=>r.id!==id);save();render();}
function addMeta(){const i=document.getElementById('mi');if(!i||!i.value.trim())return;S.metas.push({id:uid(),tx:i.value.trim()});i.value='';save();render();}
function addMetaCfg(){const i=document.getElementById('mci');if(!i||!i.value.trim())return;S.metas.push({id:uid(),tx:i.value.trim()});i.value='';save();render();}
function delMeta(id){S.metas=S.metas.filter(m=>m.id!==id);save();render();}

function render(){setHdr();({hoje:vHoje,treinos:vTreinos,cal:vCal,corpo:vCorpo,lemb:vLemb}[VIEW]||vHoje)();}
document.getElementById('bnav').addEventListener('click',e=>{
  const item=e.target.closest('[data-v]');if(!item)return;
  VIEW=item.dataset.v;
  if(VIEW==='corpo'){MMODE='view';MEDIT=null;}
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('act'));
  item.classList.add('act');render();window.scrollTo(0,0);
});
render();
</script>
</body>
</html>
